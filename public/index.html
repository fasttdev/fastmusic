<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#38a3e0">
  <meta name="description" content="FastMusic - Streaming musik premium dengan lirik tersinkronisasi, kualitas tinggi, dan antarmuka modern.">
  <title>FastMusic — Streaming Musik</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338a3e0'/%3E%3Cstop offset='1' stop-color='%235ab9ea'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M40 68V32l26-4v30' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='34' cy='68' r='7' fill='%23fff'/%3E%3Ccircle cx='60' cy='64' r='7' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ============ BACKGROUND ORBS ============ -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ============ APP LAYOUT ============ -->
  <div class="app">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <span class="logo-text">FastMusic</span>
      </div>

      <nav class="nav" aria-label="Navigasi utama">
        <button class="nav-item active" data-view="home" aria-label="Home">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12L12 3l9 9"/>
            <path d="M5 10v10h14V10"/>
          </svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-view="search" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <span>Search</span>
        </button>
        <button class="nav-item" data-view="library" aria-label="Library">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4v16h16V4z"/>
            <path d="M8 4v16"/>
            <path d="M4 8h4M4 12h4M4 16h4"/>
          </svg>
          <span>Library</span>
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Trending Now</div>
        <div class="sidebar-list" id="sidebar-trending">
          <div class="sidebar-skeleton"></div>
          <div class="sidebar-skeleton"></div>
          <div class="sidebar-skeleton"></div>
          <div class="sidebar-skeleton"></div>
        </div>
      </div>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <main class="main">

      <!-- ---------- TOPBAR ---------- -->
      <header class="topbar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Cari lagu, album, atau artis..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Kolom pencarian">
          <button class="clear-btn hidden" id="clear-search" aria-label="Hapus pencarian">✕</button>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-toggle" title="Ganti tema" aria-label="Ganti tema">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- ---------- VIEWS ---------- -->
      <div class="views">
        <section class="view active" id="view-home" aria-label="Home"></section>
        <section class="view" id="view-search" aria-label="Pencarian"></section>
        <section class="view" id="view-library" aria-label="Library"></section>
      </div>

    </main>
  </div>

  <!-- ============ PLAYER BAR ============ -->
  <div class="player-bar" id="player-bar" role="region" aria-label="Pemutar musik">

    <!-- Track Info -->
    <div class="player-track">
      <div class="player-artwork" id="player-artwork">
        <div class="artwork-placeholder">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
      </div>
      <div class="player-info">
        <div class="player-title" id="player-title">Belum ada lagu diputar</div>
        <div class="player-artist" id="player-artist">Pilih lagu untuk mulai</div>
      </div>
      <button class="icon-btn" id="like-btn" title="Suka" aria-label="Suka">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <div class="control-buttons">
        <button class="icon-btn" id="shuffle-btn" title="Acak" aria-label="Acak">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5"/>
            <path d="M4 20L21 3"/>
            <path d="M21 16v5h-5"/>
            <path d="M15 15l6 6"/>
            <path d="M4 4l5 5"/>
          </svg>
        </button>
        <button class="icon-btn" id="prev-btn" title="Sebelumnya" aria-label="Sebelumnya">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <polygon points="19,20 9,12 19,4"/>
            <rect x="5" y="4" width="2" height="16" rx="1"/>
          </svg>
        </button>
        <button class="play-btn" id="play-btn" title="Putar" aria-label="Putar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="play-icon">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </button>
        <button class="icon-btn" id="next-btn" title="Berikutnya" aria-label="Berikutnya">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <polygon points="5,4 15,12 5,20"/>
            <rect x="17" y="4" width="2" height="16" rx="1"/>
          </svg>
        </button>
        <button class="icon-btn" id="repeat-btn" title="Ulangi" aria-label="Ulangi">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 1l4 4-4 4"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <path d="M7 23l-4-4 4-4"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </div>

      <div class="progress-row">
        <span class="time" id="current-time">0:00</span>
        <div class="progress-wrap" id="progress-wrap" role="slider" aria-label="Progres lagu" tabindex="0">
          <div class="progress-track">
            <div class="progress-buffer" id="progress-buffer"></div>
            <div class="progress-bar" id="progress-bar"></div>
            <div class="progress-thumb" id="progress-thumb"></div>
          </div>
        </div>
        <span class="time" id="total-time">0:00</span>
      </div>
    </div>

    <!-- Extras -->
    <div class="player-extras">
      <button class="icon-btn" id="volume-btn" title="Bisukan" aria-label="Bisukan">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="volume-icon">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
      <input
        type="range"
        id="volume-slider"
        class="volume-slider"
        min="0"
        max="100"
        value="80"
        aria-label="Volume">
      <button class="icon-btn" id="lyrics-toggle" title="Lirik" aria-label="Lirik">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h10M4 18h16"/>
        </svg>
      </button>
      <button class="icon-btn" id="download-btn" title="Unduh" aria-label="Unduh">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M7 10l5 5 5-5"/>
          <path d="M12 15V3"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ============ LYRICS PANEL ============ -->
  <aside class="lyrics-panel" id="lyrics-panel" aria-label="Panel lirik">
    <div class="lyrics-header">
      <div class="lyrics-header-info">
        <div class="lyrics-title" id="lyrics-title">Lirik</div>
        <div class="lyrics-artist" id="lyrics-artist"></div>
      </div>
      <button class="icon-btn" id="lyrics-close" aria-label="Tutup lirik">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/>
          <path d="M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="lyrics-toggle-row">
      <label class="switch">
        <input type="checkbox" id="translate-toggle" aria-label="Terjemahkan lirik">
        <span class="slider"></span>
      </label>
      <span class="translate-label">Terjemahan Indonesia</span>
    </div>
    <div class="lyrics-content" id="lyrics-content">
      <div class="lyrics-placeholder">Pilih lagu untuk melihat lirik</div>
    </div>
  </aside>

  <!-- ============ DOWNLOAD MODAL ============ -->
  <div class="modal" id="download-modal" role="dialog" aria-modal="true" aria-labelledby="download-modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="download-modal-title">Unduh Lagu</div>
        <button class="icon-btn" id="download-close" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="download-track">
          <div class="download-artwork" id="download-artwork"></div>
          <div class="download-info">
            <div class="download-title" id="download-title">-</div>
            <div class="download-artist" id="download-artist">-</div>
          </div>
        </div>
        <div class="download-options">
          <a class="download-option" id="download-high" href="#" download>
            <div class="dl-icon">HQ</div>
            <div class="dl-info">
              <div class="dl-label">High Quality</div>
              <div class="dl-detail">MP3 · 256 kbps</div>
            </div>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M7 10l5 5 5-5"/>
              <path d="M12 15V3"/>
            </svg>
          </a>
          <a class="download-option" id="download-low" href="#" download>
            <div class="dl-icon">LQ</div>
            <div class="dl-info">
              <div class="dl-label">Low Quality</div>
              <div class="dl-detail">MP3 · 48 kbps (Hemat data)</div>
            </div>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <path d="M7 10l5 5 5-5"/>
              <path d="M12 15V3"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ TOAST CONTAINER ============ -->
  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <!-- ============ AUDIO ELEMENT ============ -->
  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

  <!-- ============ SCRIPT ============ -->
  <script src="/app.js"></script>
</body>
</html>
